{% extends 'base.html' %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="progress my-4">
    <div class="progress-bar" role="progressbar" style="width: 66%;" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100">Step 2: Checkout</div>
</div>

<h1 class="mb-4">Checkout</h1>
<form action="/process_payment" method="POST">
    <div class="mb-3">
        <label for="billing_address" class="form-label">Billing Address</label>
        <input type="text" class="form-control" id="billing_address" name="billing_address" required>
    </div>
    <div class="mb-3">
        <label for="credit_card" class="form-label">Credit Card Number</label>
        <input type="text" class="form-control" id="credit_card" name="credit_card" required>
    </div>
    <div class="mb-3">
        <label for="cvv" class="form-label">CVV</label>
        <input type="text" class="form-control" id="cvv" name="cvv" required>
    </div>
    <button type="submit" class="btn btn-success">Submit Payment</button>
</form>
<a href="/cart" class="btn btn-secondary mt-3">Back to Cart</a>
{% endblock %}
