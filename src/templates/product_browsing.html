{% extends 'base.html' %}
{% block title %}Browse Products{% endblock %}
{% block content %}
<h1 class="mt-4">Browse Products</h1>
<div class="row">
    {% for id, product in products.items() %}
    <div class="col-md-4">
        <div class="card">
            <img src="{{ url_for('static', filename='media/' + product.image) }}" class="card-img-top" alt="{{ product.name }}">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">${{ product.price }}</p>
                <a href="/product/{{ id }}" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
